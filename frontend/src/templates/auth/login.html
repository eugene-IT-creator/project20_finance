<div class="login-box">
    <div class="login-box-logo">
        <a href="javascript:void(0);">
            <img src="../../images/logo.png" alt="Logo">
        </a>
    </div>
    <div class="card">
        <div class="card-body login-card-body">
            <h1 class="text-center">Enter</h1>
            <div id="common-error" class="error invalid-feedback text-center mb-3">Wrong email or password</div>
            <form>
                <div class="input-group mb-3">
                    <input type="email" class="form-control input" placeholder="Email" id="email">
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-envelope-open"></span>
                        </div>
                    </div>
                    <span id="email-error" class="error invalid-feedback">Please enter an email address</span>
                </div>
                <div class="input-group mb-3">
                    <input type="password" class="form-control input" placeholder="Password" id="password">
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-lock"></span>
                        </div>
                    </div>
                    <span id="password-error" class="error invalid-feedback">Please enter a password</span>
                </div>
                <div class="row mb-3">
                    <div class="col-12">
                        <div class="icheck-primary">
                            <input type="checkbox" id="remember-me">
                            <label for="remember-me">
                                Remember Me
                            </label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <button type="button" class="btn btn-primary btn-block" id="process-button">Sign In</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="social-auth-links text-center mb-3">
        <p>No account yet?</p>
        <a href="/sign-up" class="btn btn-block">Go to registration</a>
    </div>
</div>
